function editProfileListItem(objName, field, index, val) {
  const obj = resolveProfileObj(objName);
  obj[field][index] = val;
}
function addProfileListItem(objName, field, rerenderFn) {
  const obj = resolveProfileObj(objName);
  obj[field] = obj[field] || [];
  obj[field].push('');
  window[rerenderFn]();
}
function editableListRow(objName, field, items, rerenderFn, addLabel) {
  return `<div>
      ${(items||[]).map((s,i)=>`
        <div class="list-edit-item">
          <textarea class="flat-input" rows="2" oninput="editProfileListItem('${objName}','${field}',${i},this.value)">${s}</textarea>
          <button class="list-edit-remove" onclick="removeProfileChip('${objName}','${field}',${i});${rerenderFn}()">${icon('x')}</button>
        </div>`).join('')}
      <button class="list-edit-add" onclick="addProfileListItem('${objName}','${field}','${rerenderFn}')">${icon('plus')} ${addLabel}</button>
    </div>`;
}
function editableChipRow(objName, field, items, rerenderFn, placeholder, labelFn) {
  const inputId = `chipadd-${objName}-${field}`;
  const getLabel = labelFn || (s => s);
  return `<div class="chip-row" style="margin-top:6px">
      ${(items||[]).map((s,i)=>`<span class="chip chip-editable">${getLabel(s)}<span class="chip-remove" onclick="removeProfileChip('${objName}','${field}',${i});${rerenderFn}()">${icon('x')}</span></span>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="${inputId}" class="flat-input" placeholder="${placeholder}" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addProfileChip('${objName}','${field}','${inputId}');${rerenderFn}();}" />
      <button class="attach-btn" style="width:auto;padding:0 14px;background:var(--surface-2);border:1px solid var(--border);color:var(--on-surface)" onclick="addProfileChip('${objName}','${field}','${inputId}');${rerenderFn}()">${icon('plus')}</button>
    </div>`;
}
function addProfileCity(objName, inputId, rerenderFn) {
  const obj = resolveProfileObj(objName);
  const input = document.getElementById(inputId);
  const val = (input.value || '').trim();
  if (!val) return;
  obj.onsite_city_custom = obj.onsite_city_custom || [];
  if (!obj.onsite_city_custom.includes(val)) obj.onsite_city_custom.push(val);
  obj.onsite_city = val;
  window[rerenderFn]();
}
function profileWorkSetupDetail(p, objName, rerenderFn) {
  const setups = p.work_setup || [];
  if (!setups.length) return '';
  const blocks = [];
  if (setups.includes('Remote')) {
    blocks.push(`<div class="onb-field-label" style="margin-left:0">Timezone you work in</div>
      <div class="chip-row">${['UTC-8 to UTC-5 (Americas)','UTC+0 to UTC+2 (Europe/Africa)','UTC+3 to UTC+6 (Middle East/S. Asia)','UTC+7 to UTC+10 (Asia/Pacific)','Flexible / any timezone'].map(o=>`<span class="chip ${p.timezone_pref===o?'on':''}" onclick="${objName}.timezone_pref='${o}';${rerenderFn}()">${o}</span>`).join('')}</div>`);
  }
  if (setups.includes('Hybrid')) {
    blocks.push(`<div class="onb-field-label" style="margin-left:0">Minimum office days you're open to (Hybrid)</div>
      <div class="chip-row">${['1 day/week','2 days/week','3 days/week','4 days/week'].map(o=>`<span class="chip ${p.hybrid_min_days===o?'on':''}" onclick="${objName}.hybrid_min_days='${o}';${rerenderFn}()">${o}</span>`).join('')}</div>`);
  }
  if (setups.includes('On-site')) {
    const cities = [...new Set([...suggestCities(p.location), ...(p.onsite_city_custom||[])])];
    const cityInputId = `onsitecity-${objName}`;
    blocks.push(`<div class="onb-field-label" style="margin-left:0">Which city can you work on-site in?${p.location ? ` <span style="color:var(--muted);font-weight:500">— near "${p.location}"</span>` : ''}</div>
      <div class="chip-row">${cities.map(o=>`<span class="chip ${p.onsite_city===o?'on':''}" onclick="${objName}.onsite_city='${o}';${rerenderFn}()">${o}</span>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="${cityInputId}" class="flat-input" placeholder="Or type a city/region…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addProfileCity('${objName}','${cityInputId}','${rerenderFn}');}" />
        <button class="attach-btn" style="width:auto;padding:0 14px;background:var(--surface-2);border:1px solid var(--border);color:var(--on-surface)" onclick="addProfileCity('${objName}','${cityInputId}','${rerenderFn}')">${icon('plus')}</button>
      </div>`);
  }
  if (setups.includes('Freelance')) {
    blocks.push(`<div class="match-note" style="margin:8px 0 0">${icon('sparkle')} We'll flag freelance / contract-based roles for you too.</div>`);
  }
  return blocks.join('');
}

function renderProfile() {
  const el = document.getElementById('screen-profile');
  const prevScroll = el.querySelector('.profile-scroll');
  const savedScrollTop = prevScroll ? prevScroll.scrollTop : 0;
  const savedWindowY = window.scrollY;
  if (app === 'candidate') {
    const p = CANDIDATE_PROFILE;
    el.innerHTML = `
      <div class="screen-title-row"><div class="screen-title">Profile</div></div>
      <div class="profile-scroll">
        <div class="ai-note">${icon('sparkle')}<div>Your profile was auto-filled by AI from your CV. You can edit any field whenever you like.</div></div>
        ${candidateProfileFieldsHTML(p, 'CANDIDATE_PROFILE', 'renderProfile')}
        <button class="btn btn-full" onclick="showToast('Profile saved')">${icon('check')} Save changes</button>
        <button class="btn btn-outline btn-full" onclick="goTo('login')">${icon('logout')} Log out</button>
      </div>`;
  } else {
    const c = COMPANY_PROFILE;
    el.innerHTML = `
      <div class="screen-title-row"><div class="screen-title">Company profile</div></div>
      <div class="profile-scroll">
        <div class="ai-note">${icon('sparkle')}<div>This is the info you filled in during company onboarding. You can edit it whenever you like.</div></div>
        <div class="company-hero"><div class="company-logo">${icon('camera')}</div><div><div class="profile-name">${c.name}</div><div class="profile-headline">${c.industry}</div></div></div>
        <div class="field" style="padding:0"><label>Company name</label><input value="${c.name}" oninput="COMPANY_PROFILE.name=this.value" /></div>
        <div class="field" style="padding:0;margin-top:20px"><label>Industry</label><input value="${c.industry}" oninput="COMPANY_PROFILE.industry=this.value" /></div>
        <div class="field" style="padding:0;margin-top:20px"><label>Size</label><input value="${c.size}" /></div>
        <div class="field" style="padding:0;margin-top:20px"><label>Salary range</label><input value="${c.salary_range}" /></div>
        <div class="field" style="padding:0;margin-top:20px"><label>Work setup</label><input value="${c.work_setup}" /></div>
        <div class="field" style="padding:0;margin-top:20px"><label>Response deadline (SLA)</label><input value="${c.sla_days} days" /></div>
        <div class="field" style="padding:0;margin-top:20px"><label>Roles you're hiring for</label>${editableChipRow('COMPANY_PROFILE', 'roles_hiring', c.roles_hiring, 'renderProfile', 'Add a role…')}</div>
        <div class="field" style="padding:0;margin-top:20px"><label>Required skills</label>${editableChipRow('COMPANY_PROFILE', 'required_skills', c.required_skills, 'renderProfile', 'Add a skill…')}</div>
        <div class="field" style="padding:0;margin-top:20px"><label>Culture values</label>${editableChipRow('COMPANY_PROFILE', 'culture_values', c.culture_values, 'renderProfile', 'Add a value…')}</div>

        <button class="btn btn-outline btn-full" onclick="goTo('login')">${icon('logout')} Log out</button>
      </div>`;
  }
  const newScroll = el.querySelector('.profile-scroll');
  if (newScroll) {
    forceScrollTop(newScroll, savedScrollTop);
    requestAnimationFrame(() => window.scrollTo(0, savedWindowY));
  }
}

/* ============================== TOAST ============================== */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
